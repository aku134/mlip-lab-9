stages:
  preprocess:
    cmd: python3 scripts/preprocess.py
    deps:
      - data/raw/data.csv
      - scripts/preprocess.py
    params:
      - preprocess
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python3 scripts/train.py
    deps:
      - data/processed/train.csv
      - scripts/train.py
      - scripts/mlflow_utils.py
    params:
      - train
    outs:
      - models/classifier.pkl
      - models/run_id.txt:
          cache: false

  evaluate:
    cmd: python3 scripts/evaluate.py
    deps:
      - models/classifier.pkl
      - data/processed/test.csv
      - models/run_id.txt
      - scripts/evaluate.py
    plots:
      - metrics/confusion_matrix.png:
          cache: false
    metrics:
      - metrics/scores.json:
          cache: false
